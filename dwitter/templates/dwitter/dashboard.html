{% extends 'base.html' %}

{% block content %}


<div class="column">
    {% for dweet in dweets %}
        <div class="box">
            {{dweet.body}}
            <span class="is-small has-text-grey-light">
                {{ dweet.created_at }} by {{ dweet.user.username }}
            </span>
        </div>
        {% endfor %}
</div>

<div class="column is-one-third">
<div class="tabs is-boxed">
    <ul>
        <li class="is-active">
            <a href="{% url 'dwitter:profile_list' %}">
                <span>All Profiles</span>
            </a>
        </li>
        <li>
            <a href="{% url 'dwitter:profile' user.profile.id %}">
                <span>My Profile</span>
            </a>
        </li>
    </ul>
</div>

<h1 class="title is-4">Dweet</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.body }}
        <button type="submit" class="button is-primary is-fullwidth mt-3">Dweet</button>
    </form>
</div>

{% endblock content %}
